name: Commit Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: commit-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up PHP 8.3
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2
        coverage: none
    - uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php8.3-composer-
    - name: Validate Composer files
      run: composer validate --strict
    - name: Install dependencies
      run: |
        composer install --no-interaction --prefer-dist
        composer check-platform-reqs
    - name: Run lint
      run: composer php:lint

  plugin-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Prepare plugin package
      run: |
        mkdir -p "${RUNNER_TEMP}/post-type-archive-pages-and-permalink-settings"
        rsync -a --exclude-from=.distignore ./ "${RUNNER_TEMP}/post-type-archive-pages-and-permalink-settings/"
    - uses: wordpress/plugin-check-action@v1
      with:
        build-dir: ${{ runner.temp }}/post-type-archive-pages-and-permalink-settings
